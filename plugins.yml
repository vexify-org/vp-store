# vp-store 插件商店清单
# 面板访问 /api/plugin/store 拉取本文件；每个条目指向仓库内相对路径的插件清单。
plugins:
  - id: demo
    name: demo
    desc: 官方示例插件：条件/循环/参数/KV/文本数学/结构化返回
    file: plugins/demo.yml

  - id: monitor
    name: monitor
    desc: 系统监控守卫：当内存/CPU 过高时按阈值告警（演示 if/while + KV 记次）
    file: plugins/monitor.yml

  - id: webguard
    name: webguard
    desc: 网站在线监测：设置监控 URL，定时探测 DOWN/UP 并累计记录失效/成功次数
    file: plugins/webguard.yml

  - id: todo
    name: todo
    desc: 待办清单：KV 累加存储，可添加/查看/清空
    file: plugins/todo.yml

  - id: counter
    name: counter
    desc: 事件计数：KV 记次，可累加/查看/归零，含定时运行日志
    file: plugins/counter.yml

  - id: pagegrab
    name: pagegrab
    desc: 网页抓取：fetch 指定 URL 并返回前 N 个字符
    file: plugins/pagegrab.yml

  - id: findtext
    name: findtext
    desc: 网页关键词计数：抓取 URL，统计关键词出现次数
    file: plugins/findtext.yml

  # —— 以下为 docker 离线部署包（zip 相对路径自动套加速，解压进 docker 目录）——
  - id: docker-mysql
    name: MySQL 8（离线镜像）
    desc: 常用 MySQL 镜像整包，离线导入即用
    zip: docker/mysql.zip
    kind: docker
  - id: docker-redis
    name: Redis 7（离线镜像）
    desc: 常用 Redis 镜像整包，离线导入即用
    zip: docker/redis.zip
    kind: docker
  - id: docker-postgres
    name: PostgreSQL 16（离线镜像）
    desc: 常用 PostgreSQL 镜像整包，离线导入即用
    zip: docker/postgres.zip
    kind: docker
  - id: docker-nginx
    name: Nginx（离线镜像）
    desc: 常用 Nginx 镜像整包，离线导入即用
    zip: docker/nginx.zip
    kind: docker
  - id: docker-portainer
    name: Portainer（离线镜像）
    desc: Docker 可视化管理面板镜像整包，离线导入即用
    zip: docker/portainer.zip
    kind: docker