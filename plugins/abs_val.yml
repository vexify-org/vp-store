# 绝对值
name: abs_val
version: 1.0.0
desc: 绝对值: 负数取负还原
url: plugins/abs_val.yml

tools:
  - id: do
    desc: 求绝对值
    params:
      - id: n
        name: 整数
        type: int
        required: true
        desc: 任意整数
    script: |
      n = atoi(arg("n"))
      if n < 0
        n = 0 - n
      end
      ret("|n|=" + itoa(n))