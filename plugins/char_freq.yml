# 字符频率: 统计指定字符出现次数
name: char_freq
version: 1.0.0
desc: 字符频率: 统计指定字符出现的次数
url: plugins/char_freq.yml

tools:
  - id: do
    desc: 统计某个子串/字符出现次数
    params:
      - id: s
        name: 文本
        type: string
        required: true
        desc: 被检索内容
      - id: needle
        name: 目标
        type: string
        required: true
        desc: 要统计的字符或词
    script: |
      s = arg("s")
      nd = arg("needle")
      cnt = 0
      i = 0
      while i + len(nd) <= len(s)
        if substr(s, i, len(nd)) == nd
          cnt = cnt + 1
          i = i + len(nd)
        else
          i = i + 1
        end
      end
      ret("[" + nd + "] 出现 " + itoa(cnt) + " 次")