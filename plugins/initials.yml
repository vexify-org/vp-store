# initials 插件：姓名首字母。
# 提取多段文本的首字符（空格分隔的词取第一个字符）。
name: initials
version: 1.0.0
desc: 首字母提取：取每个词的首字符拼接
url: plugins/initials.yml

tools:
  - id: extract
    desc: 提取首字母缩写
    params:
      - id: text
        name: 文本
        type: string
        required: true
        desc: 用空格分隔的词组
    script: |
      t = arg("text")
      out = ""
      i = 0
      take = 1
      while i < len(t)
        c = substr(t, i, 1)
        if c == " "
          take = 1
        else
          if take == 1
            out = out + c
            take = 0
          end
        end
        i = i + 1
      end
      if out == ""
        ret("输入为空")
      else
        ret("缩写：" + out)
      end