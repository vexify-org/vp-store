# 回文数判断: 正读反读一致
name: is_palindrome
version: 1.0.0
desc: 回文数判断: 数字正反读一致
url: plugins/is_palindrome.yml

tools:
  - id: do
    desc: 判断十进制整数是否为回文数
    params:
      - id: n
        name: 整数
        type: int
        required: true
        desc: 任意整数
    script: |
      n = atoi(arg("n"))
      if n < 0
        ret("负数不是回文")
      end
      save = n
      r = 0
      while n > 0
        d = n
        q = 0
        while d >= 10
          d = d - 10
          q = q + 1
        end
        r = r + r + r + r + r + r + r + r + r + r + d
        n = q
      end
      if r == save
        ret("是回文数")
      else
        ret("不是回文数")
      end