# 文本转大写: 用小写字母表做逐字符映射为大写
name: text_upper
version: 1.0.0
desc: 文本转大写: 逐字符经字母表映射为大写
url: plugins/text_upper.yml

tools:
  - id: do
    desc: 把输入字符串全部转为大写
    params:
      - id: s
        name: 文本
        type: string
        required: true
        desc: 要转换的内容
    script: |
      s = arg("s")
      lo = "abcdefghijklmnopqrstuvwxyz"
      up = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      o = ""
      i = 0
      while i < len(s)
        ch = substr(s, i, 1)
        p = -1
        j = 0
        while j < len(lo)
          if substr(lo, j, 1) == ch
            p = j
          end
          j = j + 1
        end
        if p >= 0
          o = o + substr(up, p, 1)
        else
          o = o + ch
        end
        i = i + 1
      end
      ret(o)